<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whatever</title>
  <link rel="stylesheet" href="kiss.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Webcam Frame Overlay -->
  <div class="webcam-frame">
    <div class="frame-border"></div>
    <div class="cam-label">Test Test Test</div>
  </div>

  <!-- Animated Recent Event / Alert Bar -->
  <div class="ticker-bar">
    <div class="ticker-item">
      <span class="ticker-title">NEW Follower </span>
      <span class="ticker-value" id="latest-sub">catarinaca</span>
    </div>
    <div class="ticker-divider"></div>
    <div class="ticker-item">
      <span class="ticker-title">My Bank Acount</span>
      <span class="ticker-value" id="latest-tip">$0.00</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
